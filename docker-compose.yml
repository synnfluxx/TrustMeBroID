services:
    redis-sso:
        image: redis:latest
        ports:
            - 6379:6379
        restart: always
        env_file:
            - .env
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
            interval: 1s
            timeout: 3s
            retries: 5
        networks:
            - shared-net

    sso:
        build: .
        ports:
            - "1337:1337"
            - "7171:7171"
        volumes:
            - ./storage:/app/storage
            - ./config:/app/config
        env_file:
            - .env
        environment:
            - PGSSLMODE=disable
        networks:
            - shared-net
        depends_on:
            migrator:
                condition: service_completed_successfully
            redis-sso:
                condition: service_healthy

networks:
    shared-net:
        external: true
