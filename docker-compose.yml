services:
  postgres-sso:
    image: postgres:alpine
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    command: >
      postgres
        -c max_connections=30
        -c shared_buffers=32MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
    volumes:
      - postgres_sso_data:/var/lib/postgresql/data
    networks:
      - shared-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-sso:
    image: redis:alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    deploy:
      resources:
        limits:
          memory: 96m
          cpus: "0.25"
    networks:
      - shared-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  sso:
    build: .
    ports:
      - "1337:1337"
      - "7171:7171"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
    volumes:
      - ./config:/app/config
    env_file:
      - .env
    networks:
      - shared-net
    depends_on:
      postgres-sso:
        condition: service_healthy
      redis-sso:
        condition: service_healthy
    restart: unless-stopped

networks:
  shared-net:
    external: true

volumes:
  postgres_sso_data: