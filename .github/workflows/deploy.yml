name: Deploy SSO

on:
  push:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Для сборки внутри GitHub этого токена достаточно

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 31.76.46.51
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/projects/sso
            
            # Авторизуемся в GHCR на сервере через твой personal token
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u synnfluxx --password-stdin
            
            # Стягиваем обновленный образ приложения
            docker compose pull sso
            
            # Перезапускаем только sso, не трогая работающие postgres и redis
            docker compose up -d --no-deps sso
            
            # Чистим старые зависшие образы, чтобы не забивать диск на VPS
            docker image prune -f